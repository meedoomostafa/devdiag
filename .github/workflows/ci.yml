name: ci
on:
  push:
  pull_request:
  schedule:
    # Weekly fuzz campaigns (the fuzz job is schedule-only).
    - cron: "20 3 * * 3"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        run: |
          # Gate tracked first-party files only: generated code (bpf2go) and
          # any future vendored dirs are exempt.
          unformatted="$(git ls-files '*.go' | grep -vE '(^|/)vendor/|_bpfel\.go$' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: race detector
        run: go test -race ./... -count=1

  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          # Scan every toolchain minor the test matrix supports, each at its
          # LATEST patch (check-latest): stdlib advisories are fixed in patch
          # releases, so stale patches would report already-fixed noise,
          # while scanning only the newest minor could miss advisories
          # affecting the older supported one.
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25'
      - name: Test with coverage
        run: go test ./... -count=1 -coverpkg=./... -coverprofile=coverage.out
      # Upload BEFORE enforcement so the profile survives floor failures
      # (the artifact is exactly what a regression diagnosis needs).
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
          if-no-files-found: ignore
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          # Baseline 71.2% cross-package at introduction; allowance for platform
          # variance. Ratchet policy: raise the floor as coverage grows,
          # never lower it. Known blind spot: internal/cli black-box tests
          # execute a real binary built WITHOUT instrumentation (TestMain),
          # so their exercised paths do not count toward this number.
          floor="70.4"
          echo "total coverage: ${total}% (floor: ${floor}%)"
          if awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t < f) }'; then
            echo "coverage ${total}% fell below the ${floor}% floor" >&2
            exit 1
          fi

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25'
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          # Core scripts gate at default (style) severity; live signoff
          # harnesses gate at warning until their style debt is paid down.
          shellcheck scripts/action.sh scripts/install.sh
          shellcheck -S warning scripts/live/*.sh
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  fuzz:
    # Fuzzing runs on a schedule, not per-PR: seeds execute in every
    # normal go test run, while these longer campaigns explore new
    # inputs without adding minutes to PR feedback.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/redact
            target: FuzzRedactString
          - package: ./internal/redact
            target: FuzzRedactEvidence
          - package: ./internal/capsule
            target: FuzzInspectFromBytes
          - package: ./internal/updater
            target: FuzzExtractBinary
          - package: ./internal/updater
            target: FuzzChecksumFor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.25'
      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run ${{ matrix.target }} -fuzz ${{ matrix.target }} -fuzztime 120s
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
