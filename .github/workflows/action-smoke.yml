name: Action Smoke

on:
  pull_request:
    paths:
      - action.yml
      - scripts/action.sh
      - .github/workflows/action-smoke.yml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-format:
    name: GitHub format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: devdiag
        uses: ./
        with:
          path: fixtures/minimal-repo
          format: github
          save-report: 'true'
          fail-severity: off

      - name: Assert report outputs
        shell: bash
        run: |
          test -n "${{ steps.devdiag.outputs.report-path }}"
          test -f "${{ steps.devdiag.outputs.report-path }}"
          test "${{ steps.devdiag.outputs.report-uploaded }}" = "true"
          test "${{ steps.devdiag.outputs.summary-written }}" = "true"
          test "${{ steps.devdiag.outputs.scan-exit-code }}" = "0"

  markdown-format:
    name: Markdown format with hidden findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: devdiag
        uses: ./
        with:
          path: fixtures/minimal-repo
          format: markdown
          include-hidden: 'true'
          save-report: 'true'
          fail-severity: off

      - name: Assert markdown outputs
        shell: bash
        run: |
          test -n "${{ steps.devdiag.outputs.report-path }}"
          test -f "${{ steps.devdiag.outputs.report-path }}"
          test "${{ steps.devdiag.outputs.report-uploaded }}" = "true"
          test "${{ steps.devdiag.outputs.summary-written }}" = "true"

  redaction-canary:
    name: Redaction canary end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Create canary fixture
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/devdiag-canary-fixture"
          mkdir -p "$fixture/.github/workflows"
          cat > "$fixture/.github/workflows/ci.yml" <<'YAML'
          name: fixture
          on: [push]
          jobs:
            scan:
              runs-on: ubuntu-latest
              env:
                AWS_SECRET_ACCESS_KEY: CANARYAWSKEYabcdef1234567890
                SERVICE_URL: https://devdiag:CANARYURLSECRET@example.invalid/resource
              steps:
                - run: npm test
          YAML
          cat > "$fixture/docker-compose.yml" <<'YAML'
          services:
            app:
              image: node:20
              environment:
                - API_TOKEN=${API_TOKEN:-CANARYCOMPOSEDEFAULT}
          YAML
          printf '18\n' > "$fixture/.nvmrc"

      - id: devdiag
        uses: ./
        with:
          path: ${{ runner.temp }}/devdiag-canary-fixture
          format: github
          save-report: 'true'
          fail-severity: off
          include-hidden: 'true'

      - name: Assert canaries never reach the report
        shell: bash
        run: |
          report='${{ steps.devdiag.outputs.report-path }}'
          test -f "$report"
          for canary in CANARYAWSKEYabcdef1234567890 CANARYURLSECRET CANARYCOMPOSEDEFAULT; do
            if grep -q "$canary" "$report"; then
              echo "redaction leak: $canary found in report" >&2
              exit 1
            fi
          done
          jq -e '.collectors and .findings' "$report"
          # Prove the canary-bearing evidence paths were exercised, so the
          # absence checks above cannot pass vacuously after a collection
          # regression.
          grep -q 'AWS_SECRET_ACCESS_KEY' "$report"
          grep -q 'docker-compose' "$report"
          # Version stamping: in this PR-checkout context the action path
          # has .git, so the report must carry the exact git-describe value
          # (the no-git DEVDIAG_ACTION_REF fallback is pinned by
          # TestActionVersionScript). This also catches a regression to the
          # consumer repo's github.sha.
          expected_version="$(git describe --tags --always)"
          jq -e --arg v "$expected_version" '.devdiag_version == $v' "$report"

      # Positive control: with redaction off the canaries MUST appear,
      # proving each one actually reaches the collectors.
      - id: control
        uses: ./
        with:
          path: ${{ runner.temp }}/devdiag-canary-fixture
          format: github
          save-report: 'true'
          fail-severity: off
          include-hidden: 'true'
          redact: 'off'
          artifact-name: devdiag-canary-control

      - name: Assert positive control sees all canaries
        shell: bash
        run: |
          control='${{ steps.control.outputs.report-path }}'
          test -f "$control"
          for canary in CANARYAWSKEYabcdef1234567890 CANARYURLSECRET CANARYCOMPOSEDEFAULT; do
            if ! grep -q "$canary" "$control"; then
              echo "positive control failed: $canary never reached collectors" >&2
              exit 1
            fi
          done

  error-propagation:
    name: Scan errors propagate through the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: badpath
        uses: ./
        continue-on-error: true
        with:
          path: /nonexistent-devdiag-smoke-path
          save-report: 'true'
          fail-severity: off

      - name: Assert exit 2 propagates and no stale artifact is advertised
        shell: bash
        run: |
          if [ '${{ steps.badpath.outcome }}' != 'failure' ]; then
            echo "expected badpath step to fail, got ${{ steps.badpath.outcome }}" >&2
            exit 1
          fi
          test "${{ steps.badpath.outputs.scan-exit-code }}" = "2"
          test "${{ steps.badpath.outputs.report-uploaded }}" = "false"
          test -z "${{ steps.badpath.outputs.report-path }}"

      - name: Create findings fixture
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/devdiag-findings-fixture"
          mkdir -p "$fixture"
          printf 'API_KEY=\nDB_URL=\n' > "$fixture/.env.example"
          printf 'UNRELATED=1\n' > "$fixture/.env"
          printf '18\n' > "$fixture/.nvmrc"

      - id: threshold
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/devdiag-findings-fixture
          save-report: 'true'
          fail-severity: info
          include-hidden: 'true'
          artifact-name: devdiag-threshold-report

      - name: Assert findings threshold fails the action with a report
        shell: bash
        run: |
          if [ '${{ steps.threshold.outcome }}' != 'failure' ]; then
            echo "expected threshold step to fail, got ${{ steps.threshold.outcome }}" >&2
            exit 1
          fi
          # Failure must come from the findings threshold (render exit 1),
          # not from an operational error masquerading as a pass.
          test "${{ steps.threshold.outputs.scan-exit-code }}" = "0"
          test "${{ steps.threshold.outputs.render-exit-code }}" = "1"
          test "${{ steps.threshold.outputs.report-uploaded }}" = "true"
          report='${{ steps.threshold.outputs.report-path }}'
          test -f "$report"
          jq -e '.findings | length > 0' "$report"
