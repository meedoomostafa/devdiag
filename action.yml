name: 'DevDiag'
description: 'Run DevDiag diagnostic scan and annotate findings in GitHub Actions'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  profile:
    description: 'Diagnostic profile (e.g., ai-ml)'
    required: false
    default: ''
  rule-pack:
    description: 'Path to an external deterministic rule pack'
    required: false
    default: ''
  redact:
    description: 'Redaction level: default, strict, off'
    required: false
    default: 'default'
  ci:
    description: 'Force CI/local parity collection and evaluation'
    required: false
    default: 'true'
  include-hidden:
    description: 'Include low/info and configured hidden findings in rendered and saved reports'
    required: false
    default: 'false'
  save-report:
    description: 'Save report and upload as JSON artifact'
    required: false
    default: 'true'
  summary:
    description: 'Write a short GitHub job summary'
    required: false
    default: 'true'
  fail-on-findings:
    description: 'Fail the action when DevDiag reports high or critical findings (deprecated, use fail-severity)'
    required: false
    default: 'true'
  fail-severity:
    description: 'Minimum finding severity that fails the action: off, info, low, medium, high, critical'
    required: false
    default: 'high'
  artifact-name:
    description: 'Name for the uploaded JSON report artifact'
    required: false
    default: 'devdiag-report'
  format:
    description: 'Output format: github, human, json, ndjson, markdown'
    required: false
    default: 'github'
  mask-values:
    description: 'Newline-separated literal values to register with GitHub add-mask before running DevDiag'
    required: false
    default: ''
  use-system-devdiag:
    description: 'Whether to prefer using a preinstalled devdiag binary in PATH instead of building from the action source'
    required: false
    default: 'false'
outputs:
  report-path:
    description: 'Path to the generated JSON report artifact'
    value: ${{ steps.devdiag.outputs.report-path }}
  summary-written:
    description: 'Whether the action wrote a GitHub job summary'
    value: ${{ steps.devdiag.outputs.summary-written }}
  scan-exit-code:
    description: 'The raw exit code of the devdiag scan command'
    value: ${{ steps.devdiag.outputs.scan-exit-code }}
  report-uploaded:
    description: 'Whether the JSON report was uploaded as an artifact'
    value: ${{ steps.devdiag.outputs.report-uploaded }}
  render-exit-code:
    description: 'The exit code of the devdiag report command when save-report is true'
    value: ${{ steps.devdiag.outputs.render-exit-code }}
runs:
  using: 'composite'
  steps:
    - name: Check tool availability
      id: check-tools
      run: |
        if command -v devdiag >/dev/null 2>&1; then
          echo "devdiag-found=true" >> "$GITHUB_OUTPUT"
        else
          echo "devdiag-found=false" >> "$GITHUB_OUTPUT"
        fi
        # Building from source requires the go.mod toolchain floor, not just
        # any Go: a self-hosted runner with an older Go must not skip setup.
        # Fail closed: unparsable go.mod, devel toolchains, or any non-release
        # GOVERSION all fall through to setup-go.
        REQUIRED_GO="$(sed -n 's/^go \([0-9.]*\).*/\1/p' "$GITHUB_ACTION_PATH/go.mod" 2>/dev/null || true)"
        GO_OK=false
        if [ -n "$REQUIRED_GO" ] && command -v go >/dev/null 2>&1; then
          INSTALLED_GO="$(go env GOVERSION | sed -n 's/^go\([0-9][0-9.]*\)$/\1/p')"
          if [ -n "$INSTALLED_GO" ]; then
            LOWEST="$(printf '%s\n%s\n' "$REQUIRED_GO" "$INSTALLED_GO" | sort -V | head -n1)"
            if [ "$LOWEST" = "$REQUIRED_GO" ]; then
              GO_OK=true
            fi
          fi
        fi
        echo "go-found=$GO_OK" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Set up Go
      if: steps.check-tools.outputs.go-found != 'true' && (inputs.use-system-devdiag != 'true' || steps.check-tools.outputs.devdiag-found != 'true')
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version: 'stable'

    - name: Ensure devdiag binary is prepared
      env:
        USE_SYSTEM_DEVDIAG: ${{ inputs.use-system-devdiag }}
        DEVDIAG_FOUND: ${{ steps.check-tools.outputs.devdiag-found }}
        DEVDIAG_ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ "${USE_SYSTEM_DEVDIAG}" = "true" ] && [ "${DEVDIAG_FOUND}" = "true" ]; then
          echo "Using preinstalled devdiag binary from system PATH."
        else
          if [ -f "$GITHUB_ACTION_PATH/go.mod" ]; then
            echo "Building devdiag from action source in $GITHUB_ACTION_PATH..."
            mkdir -p "$RUNNER_TEMP/devdiag-bin"
            (
              cd "$GITHUB_ACTION_PATH"
              APP_VERSION="$(bash scripts/action-version.sh)"
              go build -v -ldflags "-X github.com/meedoomostafa/devdiag/internal/version.Version=${APP_VERSION}" -o "$RUNNER_TEMP/devdiag-bin/devdiag" ./cmd/devdiag
            )
            echo "$RUNNER_TEMP/devdiag-bin" >> "$GITHUB_PATH"
          else
            echo "Error: devdiag not preinstalled and action source is not available."
            exit 1
          fi
        fi
      shell: bash

    - name: Execute DevDiag scan
      id: devdiag
      run: |
        # Run action helper script
        "$GITHUB_ACTION_PATH/scripts/action.sh"
      shell: bash
      env:
        PATH_ARG: ${{ inputs.path }}
        FORMAT: ${{ inputs.format }}
        REDACT: ${{ inputs.redact }}
        PROFILE: ${{ inputs.profile }}
        CI: ${{ inputs.ci }}
        SUMMARY: ${{ inputs.summary }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        FAIL_SEVERITY: ${{ inputs.fail-severity }}
        MASK_VALUES: ${{ inputs.mask-values }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RULE_PACK: ${{ inputs.rule-pack }}
        INCLUDE_HIDDEN: ${{ inputs.include-hidden }}
        SAVE_REPORT: ${{ inputs.save-report }}

    - name: Upload JSON Report Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      # report-uploaded is the single source of truth: the script sets it only
      # when save-report normalized to true AND a fresh report was produced.
      # Re-checking the raw input here would diverge for accepted spellings
      # like TRUE/yes/1.
      if: always() && steps.devdiag.outputs.report-uploaded == 'true'
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/devdiag-artifacts/devdiag-report.json
